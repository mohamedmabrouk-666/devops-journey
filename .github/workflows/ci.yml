
name: DevOps Journey CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # to download the Repo into our Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-journey:ci ./app

      # Step: Run the application container
      - name: Run application container
        run: |
          docker run -d --name devops-journey-test -p 8080:80 devops-journey:ci
  

      # Step: Verify application HTTP response
      - name: Smoke test
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Smoke test failed"
          docker logs devops-journey-test
          exit 1

      # Step: Stop test  container
      - name: Cleanup test container
        if: always()
        run: docker rm -f devops-journey-test || true  

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-journey:ci
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
      

       # Configure temporary AWS credentials through OIDC
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::792068516092:role/my_GitHubActions-with-ECR 
          aws-region: us-east-1

      # Authenticate Docker with Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # Tag and push the image to ECR
      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-journey:ci \
            792068516092.dkr.ecr.us-east-1.amazonaws.com/my-registry:latest

          docker push \
            792068516092.dkr.ecr.us-east-1.amazonaws.com/my-registry:latest

