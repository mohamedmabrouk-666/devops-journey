
name: DevOps Journey CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-journey:ci .

      # Step: Run the application container
      - name: Run application container
        run: |
          docker run -d --name devops-journey-test -p 8080:80 devops-journey:ci
  

      # Step: Verify application HTTP response
      - name: Smoke test
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Smoke test failed"
          docker logs devops-journey-test
          exit 1

      # Step: Stop test container
      - name: Cleanup test container
        if: always()
        run: docker rm -f devops-journey-test || true  

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devops-journey:ci
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL


